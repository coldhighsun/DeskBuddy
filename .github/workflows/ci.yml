name: CI

on:
  push:
    branches: [main]
    # Pushing a v* tag (for example v1.2.3) also runs the release job.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # The app and its tests target WPF, so they only build on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer derives the version from git tags, which needs the full history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build DeskBuddy.slnx -c Release

      - name: Test
        run: dotnet test DeskBuddy.slnx -c Release --no-build

  release:
    # Only for version tags, and only after the build and tests passed.
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer derives the version from git tags, which needs the full history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup 7
        # The runner ships Inno Setup 6, which lacks the Chinese language file the installer script uses.
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 -e --silent --accept-source-agreements --accept-package-agreements
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}", $env:ProgramFiles, "$env:LOCALAPPDATA\Programs" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like '*Inno Setup 7*' } |
            Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe of Inno Setup 7 was not found after installation."
          }
          "ISCC_PATH=$($iscc.FullName)" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: ./tools/Build-Installer.ps1 -IsccPath $env:ISCC_PATH

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $setup = Get-ChildItem artifacts/installer -Filter "DeskBuddy-Setup-*.exe" | Select-Object -First 1
          $ghArgs = @($tag, $setup.FullName, "--title", "DeskBuddy $tag", "--generate-notes", "--verify-tag")
          # A hyphen in the tag (v1.2.0-rc.1) marks a pre-release.
          if ($tag.Contains("-")) {
            $ghArgs += "--prerelease"
          }
          gh release create @ghArgs
